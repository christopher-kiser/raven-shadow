name: Validate public prototype and documentation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check documentation and local links
        run: python scripts/validate_docs.py
      - name: Check fictional verification and report integrity
        run: node --test tests/*.test.mjs
